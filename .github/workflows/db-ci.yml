name: DB skeleton CI
on:
  workflow_call:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check skeleton paths and nonempty changelogs
        shell: bash
        run: |
          set -euo pipefail
          test -s changelog/changelog-master.yaml
          for group in 01_ddl 02_dml 03_dcl 04_tcl; do
            test -s "$group/changelog.yaml"
          done
          while IFS= read -r file; do
            test -s "$file"
          done < <(find 01_ddl 02_dml 03_dcl 04_tcl -name changelog.yaml -type f)
          for path in \
            05_rollbacks/01_ddl/00_extensions \
            05_rollbacks/01_ddl/01_schemas \
            05_rollbacks/01_ddl/03_tables \
            05_rollbacks/01_ddl/04_alter \
            05_rollbacks/01_ddl/10_indexes \
            05_rollbacks/02_dml/00_inserts \
            05_rollbacks/03_dcl/00_roles \
            05_rollbacks/03_dcl/01_grants; do
            test -f "$path/.gitkeep"
          done
