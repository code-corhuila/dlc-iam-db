databaseChangeLog:
  - changeSet:
      id: 004-iam-staff-lifecycle
      author: dlc-iam-db
      changes:
        - sql:
            sql: |
              CREATE TABLE iam.staff_account_audit (
                audit_id uuid PRIMARY KEY,
                user_id uuid NOT NULL REFERENCES iam.users(user_id),
                action text NOT NULL CHECK (action IN ('REGISTERED', 'UPDATED', 'DISABLED', 'ENABLED')),
                actor_user_id uuid NOT NULL REFERENCES iam.users(user_id),
                prior_status text CHECK (prior_status IN ('PENDING_VERIFICATION', 'ACTIVE', 'LOCKED', 'DISABLED')),
                next_status text NOT NULL CHECK (next_status IN ('PENDING_VERIFICATION', 'ACTIVE', 'LOCKED', 'DISABLED')),
                occurred_at timestamptz NOT NULL,
                correlation_id uuid NOT NULL,
                CONSTRAINT staff_audit_transition CHECK (
                  (action = 'REGISTERED' AND prior_status IS NULL AND next_status = 'PENDING_VERIFICATION')
                  OR (action = 'UPDATED' AND prior_status IS NOT NULL AND next_status = prior_status)
                  OR (action = 'DISABLED' AND prior_status IS NOT NULL AND prior_status <> 'DISABLED' AND next_status = 'DISABLED')
                  OR (action = 'ENABLED' AND prior_status IS NOT NULL AND prior_status = 'DISABLED' AND next_status IN ('ACTIVE', 'PENDING_VERIFICATION'))
                )
              );
              CREATE INDEX staff_account_audit_by_user
                ON iam.staff_account_audit (user_id, occurred_at DESC);
              CREATE INDEX sessions_unrevoked_by_user
                ON iam.sessions (user_id) WHERE revoked_at IS NULL;
              ALTER TABLE iam.sessions
                ADD CONSTRAINT session_revocation_order
                  CHECK (revoked_at IS NULL OR revoked_at >= created_at),
                ADD CONSTRAINT session_revocation_reason_nonempty
                  CHECK (revocation_reason IS NULL OR length(btrim(revocation_reason)) > 0);
              ALTER TABLE iam.users
                ADD CONSTRAINT users_active_verified
                  CHECK (status <> 'ACTIVE' OR email_verified_at IS NOT NULL);
              GRANT SELECT, INSERT ON iam.staff_account_audit TO iam_runtime;
        - sql:
            splitStatements: false
            sql: |
              CREATE FUNCTION iam.guard_session_eligibility() RETURNS trigger
              LANGUAGE plpgsql AS $$
              BEGIN
                PERFORM 1 FROM iam.users
                  WHERE user_id = NEW.user_id AND status = 'ACTIVE'
                    AND email_verified_at IS NOT NULL
                  FOR SHARE;
                IF NOT FOUND THEN
                  RAISE EXCEPTION 'Staff account is not eligible for a session';
                END IF;
                RETURN NEW;
              END;
              $$;
              REVOKE ALL ON FUNCTION iam.guard_session_eligibility() FROM PUBLIC;
        - sql:
            splitStatements: false
            sql: |
              CREATE FUNCTION iam.revoke_disabled_staff_sessions() RETURNS trigger
              LANGUAGE plpgsql AS $$
              DECLARE revoked_at_now timestamptz := statement_timestamp();
              BEGIN
                IF OLD.status <> 'DISABLED' AND NEW.status = 'DISABLED' THEN
                  UPDATE iam.sessions SET revoked_at = revoked_at_now,
                      revocation_reason = 'ACCOUNT_DISABLED'
                    WHERE user_id = NEW.user_id AND revoked_at IS NULL;
                  UPDATE iam.refresh_token_families AS f SET revoked_at = revoked_at_now
                    FROM iam.sessions AS s
                    WHERE f.session_id = s.session_id AND s.user_id = NEW.user_id
                      AND f.revoked_at IS NULL;
                  UPDATE iam.refresh_credentials AS c SET revoked_at = revoked_at_now
                    FROM iam.refresh_token_families AS f
                    JOIN iam.sessions AS s ON s.session_id = f.session_id
                    WHERE c.family_id = f.family_id AND s.user_id = NEW.user_id
                      AND c.revoked_at IS NULL;
                END IF;
                RETURN NEW;
              END;
              $$;
              REVOKE ALL ON FUNCTION iam.revoke_disabled_staff_sessions() FROM PUBLIC;
        - sql:
            sql: |
              CREATE TRIGGER guard_session_eligibility
                BEFORE INSERT ON iam.sessions FOR EACH ROW
                EXECUTE FUNCTION iam.guard_session_eligibility();
              CREATE TRIGGER revoke_disabled_staff_sessions
                AFTER UPDATE OF status ON iam.users FOR EACH ROW
                EXECUTE FUNCTION iam.revoke_disabled_staff_sessions();
