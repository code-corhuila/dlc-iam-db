databaseChangeLog:
  - changeSet:
      id: 012-iam-audit-reasons
      author: dlc-iam-db
      changes:
        - sql:
            sql: |
              ALTER TABLE iam.role_assignment_audit
                ADD COLUMN reason text,
                ADD CONSTRAINT role_assignment_audit_reason_valid CHECK (
                  reason IS NULL OR (
                    length(btrim(reason)) BETWEEN 1 AND 1000
                    AND reason = btrim(reason)
                  )
                );
              ALTER TABLE iam.account_lock_audit
                ADD COLUMN reason text,
                ADD COLUMN idempotency_key uuid,
                ADD COLUMN expected_version bigint,
                ADD CONSTRAINT account_unlock_request_valid CHECK (
                  (idempotency_key IS NULL AND expected_version IS NULL)
                  OR (action = 'UNLOCKED' AND actor_user_id IS NOT NULL
                      AND idempotency_key IS NOT NULL
                      AND expected_version IS NOT NULL AND expected_version >= 1
                      AND reason IS NOT NULL)
                ),
                ADD CONSTRAINT account_lock_audit_reason_valid CHECK (
                  reason IS NULL OR (
                    length(btrim(reason)) BETWEEN 1 AND 1000
                    AND reason = btrim(reason)
                  )
                );
              CREATE UNIQUE INDEX account_unlock_idempotency_key
                ON iam.account_lock_audit (idempotency_key)
                WHERE idempotency_key IS NOT NULL;
