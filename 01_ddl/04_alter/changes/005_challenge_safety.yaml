databaseChangeLog:
  - changeSet:
      id: 005-iam-challenge-safety
      author: dlc-iam-db
      changes:
        - sql:
            sql: |
              ALTER TABLE iam.security_challenges
                ADD CONSTRAINT challenge_consumption_order
                  CHECK (consumed_at IS NULL OR (consumed_at >= created_at AND consumed_at < expires_at));
              ALTER TABLE iam.security_challenges
                ADD CONSTRAINT challenge_allowed_purpose
                  CHECK (purpose IN ('EMAIL_VERIFICATION', 'PASSWORD_RECOVERY'));
        - sql:
            splitStatements: false
            sql: |
              CREATE FUNCTION iam.guard_challenge_consumption() RETURNS trigger
              LANGUAGE plpgsql AS $$
              BEGIN
                IF TG_OP = 'INSERT' THEN
                  IF NEW.consumed_at IS NOT NULL THEN
                    RAISE EXCEPTION 'A new challenge cannot be consumed';
                  END IF;
                  RETURN NEW;
                END IF;
                IF OLD.consumed_at IS NOT NULL THEN
                  RAISE EXCEPTION 'A consumed challenge is immutable';
                END IF;
                IF ROW(NEW.challenge_id, NEW.user_id, NEW.session_id, NEW.purpose,
                       NEW.token_hash, NEW.created_at, NEW.expires_at)
                   IS DISTINCT FROM
                   ROW(OLD.challenge_id, OLD.user_id, OLD.session_id, OLD.purpose,
                       OLD.token_hash, OLD.created_at, OLD.expires_at) THEN
                  RAISE EXCEPTION 'Challenge identity and expiry are immutable';
                END IF;
                IF NEW.consumed_at IS NOT NULL AND OLD.expires_at <= statement_timestamp() THEN
                  RAISE EXCEPTION 'An expired challenge cannot be consumed';
                END IF;
                RETURN NEW;
              END;
              $$;
              REVOKE ALL ON FUNCTION iam.guard_challenge_consumption() FROM PUBLIC;
        - sql:
            sql: |
              CREATE TRIGGER guard_challenge_consumption
              BEFORE INSERT OR UPDATE ON iam.security_challenges
              FOR EACH ROW EXECUTE FUNCTION iam.guard_challenge_consumption();
